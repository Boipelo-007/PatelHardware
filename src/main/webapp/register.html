<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patel Hardware - Register</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><pattern id="grain" width="100" height="100" patternUnits="userSpaceOnUse"><circle cx="20" cy="20" r="0.5" fill="%23ffffff" opacity="0.3"/><circle cx="80" cy="40" r="0.3" fill="%23ffffff" opacity="0.4"/><circle cx="40" cy="80" r="0.4" fill="%23ffffff" opacity="0.2"/><circle cx="60" cy="10" r="0.2" fill="%23ffffff" opacity="0.5"/></pattern></defs><rect width="100" height="100" fill="%23000000"/><rect width="100" height="100" fill="url(%23grain)"/></svg>') #000;
            background-size: 50px 50px;
            font-family: 'Arial', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 0;
        }

        .register-container {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 500px;
            backdrop-filter: blur(10px);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #2d5a27;
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: #2d5a27;
            font-weight: bold;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s ease;
            background: white;
        }

        .form-group input:focus {
            outline: none;
            border-color: #2d5a27;
            box-shadow: 0 0 10px rgba(45, 90, 39, 0.2);
        }

        .form-group input.error {
            border-color: #e74c3c;
            background: #fdf2f2;
        }

        .register-btn {
            width: 100%;
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .register-btn:hover {
            background: linear-gradient(135deg, #c0392b, #a93226);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(231, 76, 60, 0.3);
        }

        .register-btn:active {
            transform: translateY(0);
        }

        .register-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
        }

        .login-link a {
            color: #8e44ad;
            text-decoration: none;
            font-weight: bold;
            transition: color 0.3s ease;
        }

        .login-link a:hover {
            color: #9b59b6;
            text-decoration: underline;
        }

        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 15px;
            border: 1px solid #f5c6cb;
            display: none;
        }

        .success-message {
            background: #d4edda;
            color: #155724;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 15px;
            border: 1px solid #c3e6cb;
            display: none;
        }

        .loading {
            display: none;
            text-align: center;
            margin-top: 10px;
        }

        .loading::after {
            content: '';
            width: 20px;
            height: 20px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #2d5a27;
            border-radius: 50%;
            display: inline-block;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .field-validation {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeaa7;
            padding: 8px 12px;
            border-radius: 5px;
            font-size: 14px;
            margin-top: 5px;
            display: none;
        }

        .form-row {
            display: flex;
            gap: 15px;
        }

        .form-row .form-group {
            flex: 1;
        }

        @media (max-width: 600px) {
            .form-row {
                flex-direction: column;
                gap: 0;
            }

            .register-container {
                margin: 20px;
                padding: 30px 20px;
            }

            .header h1 {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
<div class="register-container">
    <div class="header">
        <h1>PATEL HARDWARE</h1>
        <p>Create New Account</p>
    </div>

    <div id="errorMessage" class="error-message"></div>
    <div id="successMessage" class="success-message"></div>

    <form id="registerForm">
        <div class="form-group">
            <label for="username">Username *</label>
            <input type="text" id="username" name="username" placeholder="Enter your username" required>
            <div id="usernameValidation" class="field-validation"></div>
        </div>

        <div class="form-group">
            <label for="email">Email *</label>
            <input type="email" id="email" name="email" placeholder="Enter your email address" required>
            <div id="emailValidation" class="field-validation"></div>
        </div>

        <div class="form-group">
            <label for="password">Password *</label>
            <input type="password" id="password" name="password" placeholder="Enter your password" required>
            <div id="passwordValidation" class="field-validation"></div>
        </div>

        <div class="form-group">
            <label for="confirmPassword">Confirm Password *</label>
            <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm your password" required>
            <div id="confirmPasswordValidation" class="field-validation"></div>
        </div>

        <div class="form-group">
            <label for="fullName">Full Name</label>
            <input type="text" id="fullName" name="fullName" placeholder="Enter your full name">
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="phone">Phone</label>
                <input type="tel" id="phone" name="phone" placeholder="Phone number">
            </div>
        </div>

        <div class="form-group">
            <label for="address">Address</label>
            <input type="text" id="address" name="address" placeholder="Enter your address">
        </div>

        <button type="submit" class="register-btn" id="registerBtn">Register</button>

        <div class="loading" id="loading"></div>
    </form>

    <div class="login-link">
        Already have an account? <a href="login.html">Login here</a>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const registerForm = document.getElementById('registerForm');
        const inputs = {
            username: document.getElementById('username'),
            email: document.getElementById('email'),
            password: document.getElementById('password'),
            confirmPassword: document.getElementById('confirmPassword'),
            fullName: document.getElementById('fullName'),
            phone: document.getElementById('phone'),
            address: document.getElementById('address')
        };
        const registerBtn = document.getElementById('registerBtn');
        const loading = document.getElementById('loading');
        const errorMessage = document.getElementById('errorMessage');
        const successMessage = document.getElementById('successMessage');

        // Validation functions
        function validateUsername(username) {
            if (username.length < 3) {
                return 'Username must be at least 3 characters long';
            }
            if (!/^[a-zA-Z0-9_]+$/.test(username)) {
                return 'Username can only contain letters, numbers, and underscores';
            }
            return null;
        }

        function validateEmail(email) {
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                return 'Please enter a valid email address';
            }
            return null;
        }

        function validatePassword(password) {
            if (password.length < 6) {
                return 'Password must be at least 6 characters long';
            }
            return null;
        }

        function validateConfirmPassword(password, confirmPassword) {
            if (password !== confirmPassword) {
                return 'Passwords do not match';
            }
            return null;
        }

        function validateField(input, validationFunction, ...args) {
            const validationElement = document.getElementById(input.id + 'Validation');
            const value = input.value.trim();

            if (input.required && value === '') {
                input.classList.add('error');
                validationElement.textContent = 'This field is required';
                validationElement.style.display = 'block';
                return false;
            }

            if (value !== '' && validationFunction) {
                const error = validationFunction(value, ...args);
                if (error) {
                    input.classList.add('error');
                    validationElement.textContent = error;
                    validationElement.style.display = 'block';
                    return false;
                }
            }

            input.classList.remove('error');
            validationElement.style.display = 'none';
            return true;
        }

        function showMessage(element, message, isError = true) {
            element.textContent = message;
            element.style.display = 'block';
            if (!isError) {
                setTimeout(() => {
                    element.style.display = 'none';
                }, 5000);
            }
        }

        function hideMessages() {
            errorMessage.style.display = 'none';
            successMessage.style.display = 'none';
        }

        // Real-time validation
        inputs.username.addEventListener('blur', function() {
            validateField(this, validateUsername);
        });

        inputs.email.addEventListener('blur', function() {
            validateField(this, validateEmail);
        });

        inputs.password.addEventListener('blur', function() {
            validateField(this, validatePassword);
            // Re-validate confirm password if it has a value
            if (inputs.confirmPassword.value) {
                validateField(inputs.confirmPassword, validateConfirmPassword, this.value);
            }
        });

        inputs.confirmPassword.addEventListener('blur', function() {
            validateField(this, validateConfirmPassword, inputs.password.value);
        });

        // Form submission
        registerForm.addEventListener('submit', function(e) {
            e.preventDefault();
            hideMessages();

            // Validate all fields
            const validations = [
                validateField(inputs.username, validateUsername),
                validateField(inputs.email, validateEmail),
                validateField(inputs.password, validatePassword),
                validateField(inputs.confirmPassword, validateConfirmPassword, inputs.password.value)
            ];

            const isValid = validations.every(v => v);

            if (!isValid) {
                showMessage(errorMessage, 'Please fix the errors above.');
                return;
            }

            // Show loading state
            registerBtn.disabled = true;
            loading.style.display = 'block';

            // Prepare form data
            const formData = new FormData();
            Object.keys(inputs).forEach(key => {
                formData.append(key, inputs[key].value.trim());
            });

            // Submit form
            fetch('register', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    showMessage(successMessage, 'Registration successful! Redirecting to login...', false);
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 2000);
                } else {
                    showMessage(errorMessage, data.message || 'Registration failed. Please try again.');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                showMessage(errorMessage, 'An error occurred. Please try again later.');
            })
            .finally(() => {
                registerBtn.disabled = false;
                loading.style.display = 'none';
            });
        });
    });
</script>
</body>
</html>
